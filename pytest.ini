[pytest]
pythonpath = .
testpaths = automation_selenium/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --strict-markers
    --html=reports/selenium_test_report.html
    --self-contained-html
markers =
    auth: Authentication and session test cases (TC-01, TC-02, TC-14)
    inventory: Catalog display, details, and sorting test cases (TC-03, TC-04, TC-05)
    cart: Shopping cart add, remove, and review test cases (TC-06, TC-07, TC-08)
    checkout: Checkout steps, inputs, validation, calculation, finish, and cancel (TC-09 to TC-13)
    e2e: End-to-end full purchasing workflows
    smoke: Critical path smoke tests
    regression: Full regression test suite
